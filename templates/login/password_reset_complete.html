{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated | BettyVerse</title>
    <link rel="stylesheet" href="{% static 'css/login_style.css' %}">
    <link rel="icon" href="{% static 'images/bookmark.jpeg' %}" type="image/jpeg">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-brand-panel">
            <a class="auth-home-link" href="{% url 'home' %}">Back to Website</a>
            <div class="auth-brand-mark"><img src="{% static 'images/logo.png' %}" alt="BettyVerse logo"></div>
            <span class="auth-kicker"><i class='bx bx-check-shield'></i>Password Updated</span>
            <h1>Your password has been reset.</h1>
            <p>You can now sign in with your new BettyVerse password.</p>
        </div>
        <div class="auth-form-panel">
            <div class="auth-form">
                <span class="auth-section-label"><i class='bx bx-log-in-circle'></i>Done</span>
                <h2>All set</h2>
                <p class="auth-helper">Return to login and use your new password.</p>
                <a href="{% url 'login' %}" class="btn" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">Log In</a>
            </div>
        </div>
    </div>
</body>
</html>
